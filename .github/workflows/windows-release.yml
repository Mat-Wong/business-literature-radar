name: Check and package Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline engine self-test
        run: python search_papers.py --self-test
      - name: Local unit tests, when present
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'tests') {
            python -m unittest discover -s tests -p 'test_*.py' -v
          }

  package:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible build tool
        run: python -m pip install pyinstaller==6.22.3
      - name: Build Windows download
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            "0.1.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          ./build_windows.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: business-literature-radar-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: business-literature-radar-windows
          path: dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = Get-ChildItem -LiteralPath 'dist' -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Release archive is missing.' }
          $existing = gh release view $env:GITHUB_REF_NAME --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (@($release.assets | ForEach-Object { $_.name }) -contains $archive.Name) {
              Write-Host "Release already contains $($archive.Name); leaving the published asset unchanged."
            } else {
              gh release upload $env:GITHUB_REF_NAME $archive.FullName
            }
          } else {
            gh release create $env:GITHUB_REF_NAME $archive.FullName --generate-notes
          }
